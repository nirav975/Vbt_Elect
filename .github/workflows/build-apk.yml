name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: |
          for z in $(find . -name '*.zip' -not -path './.git/*'); do
            echo "Unzip: $z"; unzip -o -q "$z" -d unzipped
          done
          F=$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)
          if [ -z "$F" ]; then
            echo "PROJECT FILES NAHI MILI - app, gradle, settings.gradle.kts waghera upload karo"
            echo "Repository me abhi ye files hain:"
            find . -not -path './.git/*' | head -60
            exit 1
          fi
          DIR=$(dirname "$F")
          echo "Project folder: $DIR"
          cd "$DIR"
          gradle --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/CoachFixBot.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: CoachFixBot-apk
          path: CoachFixBot.apk
